apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: high-performance-pvc
  namespace: storage-lab
  annotations:
    volume.beta.kubernetes.io/storage-class: ocs-storagecluster-ceph-rbd
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: ocs-storagecluster-ceph-rbd
