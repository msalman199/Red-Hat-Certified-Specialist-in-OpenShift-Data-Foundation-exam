apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: storage-lab
  labels:
    app: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp
        image: nginx:1.21
        ports:
        - containerPort: 80
        volumeMounts:
        - name: webapp-storage
          mountPath: /usr/share/nginx/html/uploads
        - name: config-volume
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: webapp-storage
        persistentVolumeClaim:
          claimName: basic-block-pvc
      - name: config-volume
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: storage-lab
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
        }
        
        location /uploads {
            alias /usr/share/nginx/html/uploads;
            autoindex on;
        }
    }
