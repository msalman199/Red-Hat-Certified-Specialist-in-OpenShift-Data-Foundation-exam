apiVersion: v1
kind: Pod
metadata:
  name: nfs-performance-test
spec:
  serviceAccountName: nfs-service-account
  containers:
  - name: perf-test
    image: registry.redhat.io/ubi8/ubi:latest
    command: ["/bin/bash"]
    args: ["-c", "sleep 3600"]
    volumeMounts:
    - name: shared-volume
      mountPath: /test-data
  volumes:
  - name: shared-volume
    persistentVolumeClaim:
      claimName: shared-nfsv4-pvc1
  restartPolicy: Never
